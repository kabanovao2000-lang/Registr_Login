<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — УСПК WEB</title>
    <link rel="stylesheet" href="/site.css">
</head>
<body class="auth-body">

   <nav style="background-color: #212529; padding: 15px 0;">
    <div style="max-width: 1200px; margin: 0 auto; padding: 0 15px; display: flex; align-items: center; justify-content: space-between;">
        
        <a href="/" style="color: #258cfb; text-decoration: none; font-weight: bold; font-size: 18px;">
            УСПК<span style="color: #ffffff;">WEB</span>
        </a>

        <div>
            <a href="#" style="color: #ffffff; text-decoration: none; margin-right: 20px; font-size: 14px;">Преподавателю</a>
            <a href="#" style="color: #ffffff; text-decoration: none; margin-right: 20px; font-size: 14px;">Студенту</a>
            <a href="#" style="color: #ffffff; text-decoration: none; font-size: 14px;">Поддержка</a>
        </div>

    </div>
</nav>

    <!-- Форма регистрации -->
    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Регистрация</h2>

            <form class="auth-form">
                <div class="form-group">
                    <label for="fullname">ФИО</label>
                    <input type="text" class="form-control" id="fullname" placeholder="Иванов Иван Иванович" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="example@mail.ru" required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" class="form-control" id="password" placeholder="Придумайте пароль" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Повторите пароль</label>
                    <input type="password" class="form-control" id="confirm_password" placeholder="Повторите пароль" required>
                </div>

                <button type="submit" class="btn-auth">Зарегистрироваться</button>
            </form>

            <div class="auth-links">
                <a href="/index.html">Уже есть аккаунт? Войти</a>
            </div>
        </div>
    </div>

</body>
</html>
