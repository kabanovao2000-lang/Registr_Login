<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — УСПК WEB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/site.css">
</head>
<body class="auth-body">

    <!-- Навбар -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/" style="color: #258cfb;">
                УСПК<span class="text-white">WEB</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navMenu">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link text-white" href="#">Преподавателю</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Студенту</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Поддержка</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Форма регистрации -->
    <div class="auth-container">
        <div class="auth-card">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">

                    <h2 class="text-center fw-bold mb-4">Регистрация</h2>

                    <form>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="fullname" placeholder="ФИО">
                            <label for="fullname">ФИО</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="email" placeholder="Email">
                            <label for="email">Email</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="password" placeholder="Пароль">
                            <label for="password">Пароль</label>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="confirm_password" placeholder="Повторите пароль">
                            <label for="confirm_password">Повторите пароль</label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            Зарегистрироваться
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="/index.html" class="text-decoration-none" style="color: #258cfb;">
                            Уже есть аккаунт? Войти
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
